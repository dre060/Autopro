plugins {
    id "com.android.application"
}

// Signing key lives outside git (android/keystore.properties + android/autopro-release.jks).
def keystoreProps = new Properties()
def keystoreFile = rootProject.file("keystore.properties")
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }

android {
    namespace "com.autoprorepairs.admin"
    compileSdk 35

    defaultConfig {
        applicationId "com.autoprorepairs.admin"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
        resValue "string", "app_name", "Auto Pro Admin"
        resValue "string", "launcher_name", "Auto Pro"
        resValue "string", "launchUrl", "https://www.autoprorepairs.com/admin?source=android"
        resValue "string", "providerAuthority", "com.autoprorepairs.admin.fileprovider"
    }

    signingConfigs {
        release {
            if (keystoreProps["storeFile"]) {
                storeFile rootProject.file(keystoreProps["storeFile"])
                storePassword keystoreProps["storePassword"]
                keyAlias keystoreProps["keyAlias"]
                keyPassword keystoreProps["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.5.0"
}

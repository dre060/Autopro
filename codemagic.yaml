# Codemagic builds the iPhone app on a cloud Mac (no local Mac needed) and uploads
# it to App Store Connect / TestFlight. Uses the team's App Store Connect API key, plus
# the certificate (autopro_distribution) and profile (Auto Pro App Store) stored under
# Codemagic → team → Code signing identities. Both expire Nov 2027; renew them there.
workflows:
  ios-testflight:
    name: Auto Pro → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: mobile
    integrations:
      app_store_connect: ShadowVPN App Store Connect
    environment:
      flutter: 3.47.6
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.autoprorepairs.admin
      vars:
        APP_STORE_APP_ID: 6829956282   # App Store Connect → Auto Pro Shop Manager
    scripts:
      - name: Flutter packages
        script: flutter pub get
      - name: Signing
        script: xcode-project use-profiles --project ios/Runner.xcodeproj
      - name: Build signed IPA
        # Version name comes from pubspec.yaml; the build number must go up every upload.
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" || echo 0)
          flutter build ipa --release --build-number=$((LATEST + 1)) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false   # uploads for App Review and internal testers; external beta info isn't set up

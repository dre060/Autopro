# Codemagic builds the iPhone app on a cloud Mac (no local Mac needed) and uploads
# it to App Store Connect / TestFlight. Same Apple team, App Store Connect API key
# and signing key as the other Lennox Digital apps. Guide: mobile/STORE-RELEASE.md
workflows:
  ios-testflight:
    name: Auto Pro → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: mobile
    integrations:
      app_store_connect: ShadowVPN App Store Connect
    environment:
      flutter: 3.47.6
      xcode: latest
      groups:
        - ios_signing          # CERTIFICATE_PRIVATE_KEY (Lennox Digital distribution key)
      vars:
        APPLE_TEAM_ID: 8Y2GRSNQMG
        BUNDLE_ID: com.autoprorepairs.admin
        APP_STORE_APP_ID: 6829956282   # App Store Connect → Auto Pro Shop Manager
    scripts:
      - name: Flutter packages
        script: flutter pub get
      - name: Signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles --project ios/Runner.xcodeproj
      - name: Build signed IPA
        # Version name comes from pubspec.yaml; the build number must go up every upload.
        script: |
          BUILD_NUMBER=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID") + 1))
          flutter build ipa --release --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
